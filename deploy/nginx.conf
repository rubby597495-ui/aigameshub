# 1Panel Nginx Reverse Proxy Configuration for AiGamesHub
server {
    listen 80;
    server_name aigameshub.io www.aigameshub.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aigameshub.io www.aigameshub.io;

    # SSL Certificates (configured automatically via 1Panel Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/aigameshub.io.crt;
    ssl_certificate_key /etc/nginx/ssl/aigameshub.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip & Brotli Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static Assets & Images Caching
    location /uploads/ {
        alias /var/www/aigameshub/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    # Next.js Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
